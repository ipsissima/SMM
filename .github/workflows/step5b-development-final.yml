name: Step 5B final development 34-subject CV

on:
  push:
    branches:
      - step5b-confirmatory-gate-2026-10-05
    paths:
      - 'confirmatory/step5b/NUMERICAL_PROFILE.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: step5b-final-development-34
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      frozen: ${{ steps.check.outputs.frozen }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          python - <<'PY'
          import json,os
          p=json.load(open("confirmatory/step5b/NUMERICAL_PROFILE.json"))
          frozen=(p.get("status")=="FROZEN")
          if frozen:
              assert p["openblas_coretype"] == "Haswell"
              assert (int(p["sobol_candidates"]),int(p["polish_starts"])) in {(256,8),(512,16)}
              assert p["final_freeze_commit"]
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("frozen=" + ("true" if frozen else "false") + "\n")
          print("NUMERICAL_PROFILE_STATUS",p.get("status"))
          PY

  fit:
    needs: gate
    if: ${{ needs.gate.outputs.frozen == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        subject:
          - sub-001
          - sub-002
          - sub-003
          - sub-004
          - sub-005
          - sub-006
          - sub-007
          - sub-010
          - sub-011
          - sub-014
          - sub-015
          - sub-016
          - sub-017
          - sub-018
          - sub-019
          - sub-020
          - sub-021
          - sub-022
          - sub-023
          - sub-024
          - sub-025
          - sub-028
          - sub-029
          - sub-030
          - sub-031
          - sub-032
          - sub-033
          - sub-034
          - sub-035
          - sub-036
          - sub-038
          - sub-039
          - sub-040
          - sub-042
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "Haswell"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install frozen fit environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r confirmatory/step5b/requirements-gate.txt
          python - <<'PY'
          import json,os,mne,numpy,scipy,pandas
          p=json.load(open("confirmatory/step5b/NUMERICAL_PROFILE.json"))
          assert p["status"] == "FROZEN"
          assert p["openblas_coretype"] == "Haswell"
          assert mne.__version__ == "1.13.2"
          assert numpy.__version__ == "2.3.5"
          assert scipy.__version__ == "1.17.0"
          assert pandas.__version__ == "2.2.3"
          for k in ("OMP_NUM_THREADS","OPENBLAS_NUM_THREADS","MKL_NUM_THREADS","VECLIB_MAXIMUM_THREADS","NUMEXPR_NUM_THREADS"):
              assert os.environ[k] == "1"
          assert os.environ["OPENBLAS_CORETYPE"] == "Haswell"
          assert os.environ["OMP_DYNAMIC"] == "FALSE"
          assert os.environ["PYTHONHASHSEED"] == "0"
          print("FINAL_NUMERICAL_ENVIRONMENT=PASS")
          PY

      - name: Reconstruct and verify frozen DK68 network
        run: python confirmatory/step5b/reconstruct_network_frozen.py

      - name: Download validated forward gate
        uses: actions/download-artifact@v4
        with:
          name: SMM_STEP5B_FORWARD_GATE
          path: forward_gate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37376954431

      - name: Verify forward gate material hashes
        run: |
          echo "86afbddbd637ef4239b5755ef3853aafb62890ac989340fd093482ad7c9853b2  forward_gate/leadfield_DK68_64x68.csv" | sha256sum -c -
          echo "17eb1218c6cfb8b3e27ed51283e91d3e7068261a9c7595b6da2b2e358e3b8891  forward_gate/leadfield_U20.npy" | sha256sum -c -

      - name: Download frozen QC-passed development epochs
        uses: actions/download-artifact@v4
        with:
          name: SMM_STEP5B_DEV_${{ matrix.subject }}
          path: dev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37438628533

      - name: Run final frozen M2-M3 two-block CV fit
        env:
          SUBJECT: ${{ matrix.subject }}
        run: |
          mkdir -p fit_out
          PYTHONPATH=confirmatory/step5b python confirmatory/step5b/fit_cv_subject.py \
            dev/clean-epo.fif \
            --forward-dir forward_gate \
            --network-dir confirmatory/step5b/network_frozen \
            --models M2 M3 \
            --out "fit_out/${SUBJECT}.json"

      - name: Validate fit output against numerical profile
        env:
          SUBJECT: ${{ matrix.subject }}
        run: |
          python - <<'PY'
          import json,math,os
          s=os.environ["SUBJECT"]
          d=json.load(open(f"fit_out/{s}.json"))
          p=json.load(open("confirmatory/step5b/NUMERICAL_PROFILE.json"))
          expected={
              "sobol_candidates": int(p["sobol_candidates"]),
              "polish_starts": int(p["polish_starts"]),
              "polish_maxiter": int(p["polish_maxiter"]),
              "method": p["method"],
              "ftol": float(p["ftol"]),
              "gtol": float(p["gtol"]),
              "maxls": int(p["maxls"]),
              "rel_floor": float(p["rel_floor"]),
          }
          assert d["seed"] == int(p["seed"])
          assert d["optimizer"] == expected
          assert d["environment"]["thread_env"]["OPENBLAS_CORETYPE"] == "Haswell"
          assert d["n_epochs"] >= 30
          assert set(d["models"]) == {"M2","M3"}
          assert math.isfinite(d["delta_elpd_M3_minus_M2"])
          for m in ("M2","M3"):
              assert len(d["models"][m]["directions"]) == 2
              for direction in d["models"][m]["directions"]:
                  assert direction["optimizer"]["success"] is True
          print("FINAL_DEVELOPMENT_FIT_PASS",s,d["delta_elpd_M3_minus_M2"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SMM_STEP5B_DEV_FIT_${{ matrix.subject }}
          path: fit_out/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fit
    if: ${{ always() && needs.fit.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all 34 final fit artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SMM_STEP5B_DEV_FIT_sub-*
          path: development_fits
          merge-multiple: true

      - name: Aggregate and audit
        run: |
          python confirmatory/step5b/aggregate_development.py development_fits --out-dir development_aggregate
          cat development_aggregate/development_summary.md

      - uses: actions/upload-artifact@v4
        with:
          name: SMM_STEP5B_DEVELOPMENT_AGGREGATE
          path: development_aggregate/
          if-no-files-found: error
          retention-days: 90
