name: Independent EDNM original-solver short baseline reproduction
on:
  push:
    branches: [research/ednm-full-solver-validation-20261126]
    paths:
      - .github/workflows/ednm-original-smoke.yml
      - validation/ednm_original_smoke.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ednm-original:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Clone exact independently published electrodiffusive model
        run: |
          git clone https://github.com/martejulie/electrodiffusive-network-model.git external-ednm
          cd external-ednm
          git checkout 826c211c70d9027a4acb02202ca91a60de79a15d
          test "$(git rev-parse HEAD)" = "826c211c70d9027a4acb02202ca91a60de79a15d"
          git status --porcelain
      - name: Install original Python dependencies
        run: |
          python -m pip install 'numpy<2' 'scipy<1.13' 'numba<0.60' pytest
          python -m pip install -e external-ednm
          python -c 'import numpy, scipy, numba; print(numpy.__version__,scipy.__version__,numba.__version__)'
      - name: Use original compiled functions, rebuild if incompatible
        shell: bash
        run: |
          python -c 'from ednm.aot_residual import residual; from ednm.aot_jacobian import jacobian; print("Original modules loaded")' || {
            cd external-ednm
            python src/ednm/compile_residual_function.py
            python src/ednm/compile_jacobian_function.py
            cp aot_residual*.so src/ednm/
            cp aot_jacobian*.so src/ednm/
            cd ..
          }
      - name: Execute original unmodified solver in short unstimulated sealed geometry
        env:
          EDNM_OUTPUT_DIR: ${{ github.workspace }}/output
        run: |
          python validation/ednm_original_smoke.py
          python -m json.tool output/summary.json
      - name: Preserve diagnostic output and complete source manifests
        if: always()
        run: |
          mkdir -p output
          git -C external-ednm rev-parse HEAD > output/original_commit.txt
          python -m pip freeze > output/python_packages.txt
          find output -maxdepth 1 -type f -printf '%f %s bytes\n'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SMM_EDNM_ORIGINAL_BASELINE_SMOKE
          path: output/
          retention-days: 30
