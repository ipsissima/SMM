name: EDNM independent glial spatial coupling ablation
on:
  push:
    branches: [research/ednm-full-solver-validation-20261126]
    paths: [.github/workflows/ednm-glial-ablation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spatial-ablation:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [native, glial_off, glial_x2000]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Clone original source at pinned commit
        run: |
          git clone -q https://github.com/martejulie/electrodiffusive-network-model.git external-ednm
          git -C external-ednm checkout -q 826c211c70d9027a4acb02202ca91a60de79a15d
          test "$(git -C external-ednm rev-parse HEAD)" = "826c211c70d9027a4acb02202ca91a60de79a15d"
      - name: Install compatible published solver environment
        run: |
          python -m pip install 'numpy<2' 'scipy<1.13' 'numba<0.60'
          python -m pip install -e external-ednm
      - name: Alter ONLY interunit glial ionic coupling for intervention
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          kind=os.environ['VARIANT']
          file=Path('external-ednm/src/ednm/model.py')
          source=file.read_text()
          anchor="f_1 = D[k] * upsilon[k][r] / (lambdas[r]**2 * dxu)"
          assert source.count(anchor)==1
          factor={'native':'1.0','glial_off':'0.0','glial_x2000':'2000.0'}[kind]
          if kind!='native':
              replacement=f"f_1 = ({factor} if r == 1 else 1.0) * D[k] * upsilon[k][r] / (lambdas[r]**2 * dxu)"
              source=source.replace(anchor,replacement)
              file.write_text(source)
          print('VARIANT',kind,'FACTOR',factor)
          assert (file.read_text().count('f_1 = '))>=2
          PY
          if [ "$VARIANT" != native ]; then
            cd external-ednm
            python src/ednm/compile_residual_function.py
            python src/ednm/compile_jacobian_function.py
            python ../validation/fix_aot.py .
            python -c 'from ednm.aot_residual import residual;from ednm.aot_jacobian import jacobian'
          fi
      - name: Execute matched source-model baseline and K transfer
        run: python validation/ednm_stimulus_challenge.py
      - name: Archive variant + numerical reproducibility information
        if: always()
        run: |
          mkdir -p output/pulse_test
          printf '%s\n' "$VARIANT" > output/pulse_test/variant.txt
          sha256sum external-ednm/src/ednm/model.py > output/pulse_test/model_source_sha256.txt
          python -m pip freeze > output/pulse_test/python_packages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EDNM_SPATIAL_${{ matrix.variant }}
          path: output/pulse_test/
          retention-days: 30
