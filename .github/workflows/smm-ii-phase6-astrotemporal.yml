name: SMM-II Phase VI calcium temporal replication
on:
  push:
    branches: [research/smm-ii-public-data]
    paths: ['.github/workflows/smm-ii-phase6-astrotemporal.yml']
permissions:
  contents: read
jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy
      - run: python -u research/smm-ii/phase6/astro_temporal.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-astro-temporal
          path: output/
          retention-days: 90
