name: Resume native EDNM joint-source rivals and refine best frozen candidate
on:
  push:
    branches: [research/ednm-native-resume-20261127]
    paths: [.github/workflows/ednm-native-resume.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fit:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: uniform, nuisance: glial_and_ecs}
          - {start: total_matched, nuisance: glial_and_ecs}
    env:
      START: ${{ matrix.start }}
      NUISANCE: ${{ matrix.nuisance }}
      PYTHONPATH: ${{ github.workspace }}/validation/graph_extensions
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install exact pinned solver
        run: |
          git clone -q https://github.com/martejulie/electrodiffusive-network-model.git external-ednm
          git -C external-ednm checkout -q 826c211c70d9027a4acb02202ca91a60de79a15d
          test "$(git -C external-ednm rev-parse HEAD)" = 826c211c70d9027a4acb02202ca91a60de79a15d
          python -m pip install 'numpy==1.26.4' 'scipy==1.12.0' 'numba==0.59.1'
          python -m pip install -e external-ednm
          python -c 'from ednm.aot_residual import residual; from ednm.aot_jacobian import jacobian'
      - name: Apply identical neutral KCl protocol and graph correction
        run: |
          python validation/graph_extensions/patch_source_solver.py external-ednm
          python - <<'PY'
          from pathlib import Path
          p=Path('external-ednm/src/ednm/solver.py')
          s=p.read_text()
          old='dt = 5e-5                # time step'
          assert s.count(old)==1
          s=s.replace(old,'dt = 0.001                # initial fitting resolution')
          old='        rsd = norm(Res, np.inf)'
          assert s.count(old)==1
          s=s.replace(old,
              '        source_rate = stimulus_protocol.get("kcl_rate_tissue", 0.0)\n'
              '        if round(0.08/dt) <= round(t/dt) < round(0.28/dt):\n'
              '            i = stimulus_protocol.get("kcl_site", 0)\n'
              '            for ion in (1, 2):\n'
              '                Res[int(jc_s[ion][2] + N_unknowns_unit*i)] += dt*source_rate/model.gamma_m\n'+old)
          p.write_text(s)
          # Avoid printing multi-megabyte logs for every optimization call;
          # preserve convergence check in the actual Newton loop.
          old='    alpha = [alpha_s[0:-1], alpha_d[0:-1]]'
          assert s.count(old)==1
          s=s.replace(old,'    if rsd >= tol and N_iter >= itermax: raise RuntimeError("Unconverged Newton step")\n'+old)
          p.write_text(s)
          PY
      - name: Joint fit sources 0 and 2, freeze weights and test source 4
        run: |
          cat > /tmp/fit.py <<'PY'
          import contextlib, json, os, tempfile, time
          from pathlib import Path
          import numpy as np
          from scipy.optimize import least_squares
          from ednm import model,solver
          from ednm_graph_adapter import closed_path
          began=time.monotonic()
          soft_budget_s=285*60
          N=7; dt=.001; d=37e-4
          E=closed_path(N); G=E.copy()
          for i,j,w in [(0,4,.8),(1,5,.5),(2,6,.6)]:G[i,j]=G[j,i]=w
          out=Path('output');out.mkdir(exist_ok=True)
          def path(weights):
              a=np.zeros((N,N))
              for i,w in enumerate(weights):a[i,i+1]=a[i+1,i]=w
              return a
          def simulate(g,e,source,rate):
              solver.graph_glial=g;solver.graph_ecs=e
              with tempfile.TemporaryDirectory() as tmp,open(os.devnull,'w') as sink:
                  with contextlib.redirect_stdout(sink):
                      solver.solve_system(model.Model(N,d,0,0),tmp+'/',.8,
                          dict(j_stim=0.,stim_start=.08,stim_end=.28,N_stim=1,
                               spike_train=np.zeros((2,N)),kcl_rate_tissue=rate,kcl_site=source))
                  with np.load(Path(tmp)/'data.npz') as a:
                      t,alpha,c,phi=[a[k] for k in ('t','alpha','c','phi')]
              assert all(np.isfinite(x).all() for x in (t,alpha,c,phi))
              fr=np.concatenate([alpha,1-alpha.sum(axis=2,keepdims=True)],axis=2)
              assert np.min(fr)>0 and np.min(c[:,:,:3,:,:])>0
              mass=np.einsum('tldu,tlidu->ti',fr,c)
              nsteps=np.clip(np.rint(t/dt).astype(int)-round(.08/dt)+1,0,round(.28/dt)-round(.08/dt))
              expected=mass[0]+(nsteps*dt*rate)[:,None]*np.array([0.,1.,1.,0.])[None,:]
              err=float(np.max(abs(mass-expected)/np.maximum(abs(expected),1e-12)))
              assert err<1e-7,err
              return t,c[:,0,1,2,:],phi[:,0,0,:]-phi[:,0,2,:],err
          # Uniform initial state and no synapses imply spatially uniform baseline;
          # confirm invariance numerically for shortcut and ordinary path before reusing.
          b=simulate(E,E,0,0.); b2=simulate(G,E,0,0.)
          assert np.max(abs(b[1]-b2[1]))<1e-7 and np.max(abs(b[2]-b2[2]))<1e-6
          assert np.max(np.ptp(b[1],axis=1))<1e-7 and np.max(np.ptp(b[2],axis=1))<1e-6
          t=b[0]
          def response(g,e,src):
              r=simulate(g,e,src,30.)
              assert np.allclose(r[0],t,atol=1e-12,rtol=0)
              return r[1]-b[1],r[2]-b[2],r[3]
          y=response(G,E,0); y2=response(G,E,2); hold=response(G,E,4)
          # Separate source-0 fitting from source-2 held-out validation.
          # Sample 15 predeclared time points in the fitting objective.
          ix=np.array([np.argmin(abs(t-x)) for x in np.linspace(.1,.8,15)])
          def features(r):return np.r_[r[0][ix].ravel()/.001,r[1][ix].ravel()/.01]
          target=np.r_[features(y),features(y2)]
          free_ecs=os.environ['NUISANCE']=='glial_and_ecs'
          assert free_ecs
          origins={"total_matched":{"job_id":140098938130,"eval":268,"D2":128347.0647449653,"weights":[18.704496663571447,1.8832380553780264,6.5494561478046505,26.009813115577312,3.342962830165705,4.7849613327875895,0.9301364754321546,0.965578614293707,0.9415872202366558,0.7097331848326108,0.6562165366223025,1.8278416170012663]},"uniform":{"job_id":140098938366,"eval":267,"D2":129483.67146785514,"weights":[12.9309223878057,1.9941255229484505,6.70092550316313,17.835159420232692,4.401185375008181,4.6127227496556005,0.934084096614739,0.9641331800169499,0.9417216925254976,0.7145889157450989,0.6008944328311187,1.7196292777865163]}}
          origin=origins[os.environ['START']]
          origin.update(dict(run_id=45874768150, original_commit='cba139b58a39ee13769c601888a17ec5559e3797'))
          start=np.array(origin['weights'],dtype=float)
          assert start.shape==(12,) and np.all((start>=0)&(start<=500))
          (out/'resume_origin.json').write_text(json.dumps(origin,indent=2)+'\n')
          print('RESUME_ORIGIN',json.dumps(origin),flush=True)
          cache={}; history=[]; best=[float('inf'),None]
          class SoftBudgetReached(Exception):pass
          def atomic_json(path,payload):
              temp=path.with_suffix('.tmp')
              temp.write_text(json.dumps(payload,indent=2)+'\n')
              os.replace(temp,path)
          def residual(w):
              key=tuple(w)
              if key in cache:return cache[key]
              if best[1] is not None and time.monotonic()-began>=soft_budget_s:
                  raise SoftBudgetReached('Soft runtime budget reached; preserve best evaluated training candidate')
              g=path(w[:6]);e=path(w[6:]) if free_ecs else E
              r=response(g,e,0);r2=response(g,e,2);z=np.r_[features(r),features(r2)]-target
              score=float(z@z);history.append(dict(eval=len(history)+1,weights=w.tolist(),D2=score,mass_error=r[2]))
              if len(history)==1:
                  assert np.isclose(score,origin['D2'],rtol=1e-5,atol=1e-6), (score,origin)
              if score<best[0]:
                  best[:]=[score,w.copy()]
                  atomic_json(out/'checkpoint.json',dict(origin=origin,best=history[-1],elapsed_s=time.monotonic()-began))
              atomic_json(out/'trace.json',history)
              print('FIT_EVAL',json.dumps(history[-1]),flush=True)
              cache[key]=z
              return z
          # Broad finite bounds, declared before fitting; report active bounds.
          # Local nonlinear optimization, not certified global minimum.
          opt=None
          stopped_on_budget=False
          try:
              opt=least_squares(residual,start,bounds=(0.,500.),diff_step=.002,
                                max_nfev=60,ftol=1e-5,xtol=1e-5,gtol=1e-5,x_scale='jac')
          except SoftBudgetReached as exc:
              stopped_on_budget=True
              print('SOFT_BUDGET',str(exc),flush=True)
          assert best[1] is not None
          w=best[1];g=path(w[:6]);e=path(w[6:]) if free_ecs else E
          train=response(g,e,0);train2=response(g,e,2);test=response(g,e,4)
          def score(r,z):
              k=r[0]-z[0];v=r[1]-z[1]
              delta=features(r)-features(z)
              return dict(D2=float(delta@delta),relative_K_residual=float(np.linalg.norm(k)/np.linalg.norm(z[0])),
                          relative_Vm_residual=float(np.linalg.norm(v)/np.linalg.norm(z[1])),
                          K_RMS_mM=float(np.sqrt(np.mean(k*k))),Vm_RMS_mV=float(np.sqrt(np.mean(v*v))),
                          max_abs_K_mM_by_node=np.max(abs(k),axis=0).tolist(),
                          max_abs_Vm_mV_by_node=np.max(abs(v),axis=0).tolist())
          comparisons={}
          for name,ww in [('ordinary',np.ones(6)),('total_matched',np.full(6,7.9/6))]:
              comparisons[name]={'train':score(response(path(ww),E,0),y),'train2':score(response(path(ww),E,2),y2),'held_out':score(response(path(ww),E,4),hold)}
          r=dict(start=os.environ['START'],nuisance=os.environ['NUISANCE'],dt_s=dt,weights=w.tolist(),
                 train=score(train,y),train2=score(train2,y2),held_out=score(test,hold),controls=comparisons,
                 success=bool(opt.success) if opt is not None else False,
                 status=int(opt.status) if opt is not None else -100,
                 message=str(opt.message) if opt is not None else 'Soft runtime budget reached; not a convergence claim',
                 nfev=int(opt.nfev) if opt is not None else None,
                 njev=int(opt.njev) if opt is not None and opt.njev is not None else None,
                 actual_solve_evaluations=len(history),stopped_on_budget=stopped_on_budget,resume_origin=origin,
                 optimizer_solution_weights=opt.x.tolist() if opt is not None else None,
                 optimality=float(opt.optimality) if opt is not None else None,
                 active_mask=opt.active_mask.tolist() if opt is not None else None,
                 weight_bounds=[0.,500.],samples_s=t[ix].tolist(),noise_K_mM=.001,noise_Vm_mV=.01,
                 source_train=[0,2],source_test=4,notes='Restricted to fixed native membrane kinetics; no global optimum claim. Refined timestep validation required.')
          (out/'summary.json').write_text(json.dumps(r,indent=2)+'\n')
          np.savez_compressed(out/'responses.npz',t=t,train_target_K=y[0],train_target_V=y[1],train2_target_K=y2[0],train2_target_V=y2[1],train2_fit_K=train2[0],train2_fit_V=train2[1],
               train_fit_K=train[0],train_fit_V=train[1],test_target_K=hold[0],test_target_V=hold[1],
               test_fit_K=test[0],test_fit_V=test[1])
          print('JOINT_RIVAL_FIT',json.dumps(r),flush=True)
          PY
          python /tmp/fit.py
      - name: Archive solver provenance
        if: always()
        run: |
          mkdir -p output
          git -C external-ednm diff -- src/ednm/solver.py > output/source.diff
          git -C external-ednm rev-parse HEAD > output/pinned_source_commit.txt
          python -m pip freeze > output/versions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EDNM_NATIVE_RESUME_${{ matrix.nuisance }}_${{ matrix.start }}
          path: output/
          retention-days: 90
  refine:
    needs: fit
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: [joint_glial_and_ecs]
        dt: ['0.001','0.00025']
    env:
      FAMILY: ${{ matrix.family }}
      DT: ${{ matrix.dt }}
      PYTHONPATH: ${{ github.workspace }}/validation/graph_extensions
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cba139b58a39ee13769c601888a17ec5559e3797
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          pattern: EDNM_NATIVE_RESUME_*
          path: data/joint
      - name: Install exact pinned solver
        run: |
          git clone -q https://github.com/martejulie/electrodiffusive-network-model.git external-ednm
          git -C external-ednm checkout -q 826c211c70d9027a4acb02202ca91a60de79a15d
          test "$(git -C external-ednm rev-parse HEAD)" = 826c211c70d9027a4acb02202ca91a60de79a15d
          python -m pip install 'numpy==1.26.4' 'scipy==1.12.0' 'numba==0.59.1'
          python -m pip install -e external-ednm
          python -c 'from ednm.aot_residual import residual; from ednm.aot_jacobian import jacobian'
      - name: Apply identical neutral KCl protocol and graph correction
        run: |
          python validation/graph_extensions/patch_source_solver.py external-ednm
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('external-ednm/src/ednm/solver.py')
          s=p.read_text()
          old='dt = 5e-5                # time step'
          assert s.count(old)==1
          s=s.replace(old,'dt = '+os.environ['DT']+'                # frozen candidate validation')
          old='        rsd = norm(Res, np.inf)'
          assert s.count(old)==1
          s=s.replace(old,
              '        source_rate = stimulus_protocol.get("kcl_rate_tissue", 0.0)\n'
              '        if round(0.08/dt) <= round(t/dt) < round(0.28/dt):\n'
              '            i = stimulus_protocol.get("kcl_site", 0)\n'
              '            for ion in (1, 2):\n'
              '                Res[int(jc_s[ion][2] + N_unknowns_unit*i)] += dt*source_rate/model.gamma_m\n'+old)
          p.write_text(s)
          # Avoid printing multi-megabyte logs for every optimization call;
          # preserve convergence check in the actual Newton loop.
          old='    alpha = [alpha_s[0:-1], alpha_d[0:-1]]'
          assert s.count(old)==1
          s=s.replace(old,'    if rsd >= tol and N_iter >= itermax: raise RuntimeError("Unconverged Newton step")\n'+old)
          p.write_text(s)
          PY
      - name: Evaluate frozen fitted candidates without reoptimization
        run: |
          cat > /tmp/fit.py <<'PY'
          import contextlib, json, os, tempfile
          from pathlib import Path
          import numpy as np
          from scipy.optimize import least_squares
          from ednm import model,solver
          from ednm_graph_adapter import closed_path
          N=7; dt=float(os.environ['DT']); d=37e-4
          E=closed_path(N); G=E.copy()
          for i,j,w in [(0,4,.8),(1,5,.5),(2,6,.6)]:G[i,j]=G[j,i]=w
          out=Path('output');out.mkdir(exist_ok=True)
          def path(weights):
              a=np.zeros((N,N))
              for i,w in enumerate(weights):a[i,i+1]=a[i+1,i]=w
              return a
          def simulate(g,e,source,rate):
              solver.graph_glial=g;solver.graph_ecs=e
              with tempfile.TemporaryDirectory() as tmp,open(os.devnull,'w') as sink:
                  with contextlib.redirect_stdout(sink):
                      solver.solve_system(model.Model(N,d,0,0),tmp+'/',.8,
                          dict(j_stim=0.,stim_start=.08,stim_end=.28,N_stim=1,
                               spike_train=np.zeros((2,N)),kcl_rate_tissue=rate,kcl_site=source))
                  with np.load(Path(tmp)/'data.npz') as a:
                      t,alpha,c,phi=[a[k] for k in ('t','alpha','c','phi')]
              assert all(np.isfinite(x).all() for x in (t,alpha,c,phi))
              fr=np.concatenate([alpha,1-alpha.sum(axis=2,keepdims=True)],axis=2)
              assert np.min(fr)>0 and np.min(c[:,:,:3,:,:])>0
              mass=np.einsum('tldu,tlidu->ti',fr,c)
              nsteps=np.clip(np.rint(t/dt).astype(int)-round(.08/dt)+1,0,round(.28/dt)-round(.08/dt))
              expected=mass[0]+(nsteps*dt*rate)[:,None]*np.array([0.,1.,1.,0.])[None,:]
              err=float(np.max(abs(mass-expected)/np.maximum(abs(expected),1e-12)))
              assert err<1e-7,err
              return t,c[:,0,1,2,:],phi[:,0,0,:]-phi[:,0,2,:],err
          # Uniform initial state and no synapses imply spatially uniform baseline;
          # confirm invariance numerically for shortcut and ordinary path before reusing.
          b=simulate(E,E,0,0.); b2=simulate(G,E,0,0.)
          assert np.max(abs(b[1]-b2[1]))<1e-7 and np.max(abs(b[2]-b2[2]))<1e-6
          assert np.max(np.ptp(b[1],axis=1))<1e-7 and np.max(np.ptp(b[2],axis=1))<1e-6
          t=b[0]
          def response(g,e,src):
              r=simulate(g,e,src,30.)
              assert np.allclose(r[0],t,atol=1e-12,rtol=0)
              return r[1]-b[1],r[2]-b[2],r[3]
          y=response(G,E,0); y2=response(G,E,2); hold=response(G,E,4)
          family,nuisance=os.environ['FAMILY'].split('_',1)
          paths=sorted(Path('data',family).glob('*'+nuisance+'*/summary.json'))
          assert len(paths)==2, (family,nuisance,'Both resumed fits must produce saved candidates',paths)
          candidates=[json.loads(p.read_text()) for p in paths]
          def cost(r):
              return r['train']['D2']+(r['train2']['D2'] if family=='joint' else 0.)
          fit=min(candidates,key=cost)
          weights=np.asarray(fit['weights'],float)
          g=path(weights[:6]); e=path(weights[6:]) if len(weights)==12 else E
          # Select by original training cost alone, never held-out scores.
          b3=simulate(g,e,0,0.)
          assert np.max(abs(b[1]-b3[1]))<1e-7 and np.max(abs(b[2]-b3[2]))<1e-6
          ix=np.array([np.argmin(abs(t-x)) for x in np.linspace(.1,.8,15)])
          def features(r):return np.r_[r[0][ix].ravel()/.001,r[1][ix].ravel()/.01]
          def score(r,z):
              k=r[0]-z[0];v=r[1]-z[1];delta=features(r)-features(z)
              return dict(D2=float(delta@delta),relative_K_residual=float(np.linalg.norm(k)/np.linalg.norm(z[0])),
                          relative_Vm_residual=float(np.linalg.norm(v)/np.linalg.norm(z[1])),
                          K_RMS_mM=float(np.sqrt(np.mean(k*k))),Vm_RMS_mV=float(np.sqrt(np.mean(v*v))),
                          max_abs_K_mM_by_node=np.max(abs(k),axis=0).tolist(),
                          max_abs_Vm_mV_by_node=np.max(abs(v),axis=0).tolist())
          targets={0:y,2:y2,4:hold}
          scores={}; arrays={'t':t}
          for src,z in targets.items():
              r=response(g,e,src)
              scores[str(src)]=score(r,z)
              arrays.update({f'K_target_{src}':z[0],f'Vm_target_{src}':z[1],f'K_rival_{src}':r[0],f'Vm_rival_{src}':r[1]})
          result=dict(family=family,nuisance=nuisance,dt_s=dt,selected_start=fit['start'],
                      original_fit_success=fit['success'],original_fit_training_cost=cost(fit),
                      weights=weights.tolist(),scores=scores,training_sources=[0,2] if family=='joint' else [0],
                      held_out_sources=[4] if family=='joint' else [2,4],samples_s=t[ix].tolist(),
                      description='Frozen-candidate forward numerical refinement, not reoptimization or a proof of global minimality')
          (out/'summary.json').write_text(json.dumps(result,indent=2)+'\n')
          np.savez_compressed(out/'responses.npz',**arrays)
          print('FROZEN_RIVAL_REFINEMENT',json.dumps(result),flush=True)
          PY
          python /tmp/fit.py
      - name: Archive solver provenance
        if: always()
        run: |
          mkdir -p output
          git -C external-ednm diff -- src/ednm/solver.py > output/source.diff
          git -C external-ednm rev-parse HEAD > output/pinned_source_commit.txt
          python -m pip freeze > output/versions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EDNM_NATIVE_RESUMED_FROZEN_${{ matrix.family }}_dt${{ matrix.dt }}
          path: output/
          retention-days: 90
