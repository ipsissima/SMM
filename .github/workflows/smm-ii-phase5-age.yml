name: SMM-II phase V developmental multionic response
on:
  push:
    branches: [research/smm-ii-public-data]
    paths: ['.github/workflows/smm-ii-phase5-age.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  age:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: 0, dt: '0.001'}
          - {mode: 1, dt: '0.001'}
          - {mode: 2, dt: '0.001'}
          - {mode: 3, dt: '0.001'}
          - {mode: 4, dt: '0.001'}
          - {mode: 5, dt: '0.001'}
          - {mode: 1, dt: '0.0005'}
          - {mode: 4, dt: '0.0005'}
    env:
      D_UM: '42'
      MU: '1'
      MODE: ${{ matrix.mode }}
      DT: ${{ matrix.dt }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: ${{ github.workspace }}/research/smm-ii
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned EDNM
        run: |
          git clone -q https://github.com/martejulie/electrodiffusive-network-model.git external-ednm
          git -C external-ednm checkout -q 826c211c70d9027a4acb02202ca91a60de79a15d
          test "$(git -C external-ednm rev-parse HEAD)" = 826c211c70d9027a4acb02202ca91a60de79a15d
          pip install 'numpy==1.26.4' 'scipy==1.12.0' 'numba==0.59.1'
          pip install -e external-ednm
      - name: Full multionic forced-response sweep
        run: |
          set -euo pipefail
          mkdir -p output
          python -u research/smm-ii/phase5_age_transfer.py 2>&1 | tee output/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: age-${{ matrix.mode }}-${{ matrix.dt }}
          path: output/
          retention-days: 90
