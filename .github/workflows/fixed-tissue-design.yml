name: Fixed tissue finite-volume and observation design
on:
  push:
    branches: [research/ednm-geometry-scale-20261126]
    paths: [.github/workflows/fixed-tissue-design.yml, validation/graph_extensions/fixed_tissue_design.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  passive:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install numpy==1.26.4 scipy==1.12.0
      - run: python validation/graph_extensions/fixed_tissue_design.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SMM_FIXED_TISSUE_DESIGN
          path: output/
          retention-days: 90
