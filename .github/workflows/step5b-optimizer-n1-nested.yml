name: Step 5B N1 normalized nested optimizer probe
# N1 execution trigger 2026-10-06

on:
  workflow_dispatch:
  push:
    branches:
      - step5b-confirmatory-gate-2026-10-05
    paths:
      - '.github/workflows/step5b-optimizer-n1-nested.yml'
      - 'confirmatory/step5b/N1_NESTED_OPTIMIZER_PROTOCOL.md'
      - 'confirmatory/step5b/nested_optimizer_probe.py'
      - 'confirmatory/step5b/aggregate_nested_optimizer_probe.py'

permissions:
  actions: read
  contents: read

concurrency:
  group: step5b-optimizer-n1-nested
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - kernel: haswell
            coretype: Haswell
          - kernel: sandybridge
            coretype: Sandybridge
          - kernel: zen
            coretype: Zen
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: ${{ matrix.coretype }}
      OPENBLAS_VERBOSE: "2"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Require holdout closed and numerical profile pending
        run: |
          python - <<'PY'
          import json
          gate=json.load(open("confirmatory/step5b/HOLDOUT_GATE.json"))
          profile=json.load(open("confirmatory/step5b/NUMERICAL_PROFILE.json"))
          assert gate["status"] == "CLOSED"
          assert profile["status"] == "PENDING"
          print("N1_INFORMATION_BARRIER=PASS")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install pinned numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r confirmatory/step5b/requirements-gate.txt
          python - <<'PY'
          import os,mne,numpy,scipy,pandas,platform
          assert mne.__version__ == "1.13.2"
          assert numpy.__version__ == "2.3.5"
          assert scipy.__version__ == "1.17.0"
          assert pandas.__version__ == "2.2.3"
          for k in ("OMP_NUM_THREADS","OPENBLAS_NUM_THREADS","MKL_NUM_THREADS","VECLIB_MAXIMUM_THREADS","NUMEXPR_NUM_THREADS"):
              assert os.environ[k] == "1"
          assert os.environ["OMP_DYNAMIC"] == "FALSE"
          assert os.environ["PYTHONHASHSEED"] == "0"
          print("RUNNER_IMAGE",os.environ.get("ImageOS"),os.environ.get("ImageVersion"))
          print("PLATFORM",platform.platform())
          print("OPENBLAS_CORETYPE",os.environ.get("OPENBLAS_CORETYPE"))
          print("N1_ENVIRONMENT=PASS")
          PY

      - name: Reconstruct and verify frozen DK68 network
        run: python confirmatory/step5b/reconstruct_network_frozen.py

      - name: Download validated forward gate
        uses: actions/download-artifact@v4
        with:
          name: SMM_STEP5B_FORWARD_GATE
          path: forward_gate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37376954431

      - name: Verify forward gate material hashes
        run: |
          echo "86afbddbd637ef4239b5755ef3853aafb62890ac989340fd093482ad7c9853b2  forward_gate/leadfield_DK68_64x68.csv" | sha256sum -c -
          echo "17eb1218c6cfb8b3e27ed51283e91d3e7068261a9c7595b6da2b2e358e3b8891  forward_gate/leadfield_U20.npy" | sha256sum -c -

      - name: Download frozen development sub-001 epochs
        uses: actions/download-artifact@v4
        with:
          name: SMM_STEP5B_DEV_sub-001
          path: dev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37438628533

      - name: Run frozen N1 normalized nested-comparator probe
        env:
          KERNEL: ${{ matrix.kernel }}
        run: |
          mkdir -p n1_out
          PYTHONPATH=confirmatory/step5b python confirmatory/step5b/nested_optimizer_probe.py \
            dev/clean-epo.fif \
            --forward-dir forward_gate \
            --network-dir confirmatory/step5b/network_frozen \
            --out "n1_out/sub-001-${KERNEL}.json"

      - name: Require all per-kernel N1 invariants
        env:
          KERNEL: ${{ matrix.kernel }}
        run: |
          python - <<'PY'
          import json,os
          p=f"n1_out/sub-001-{os.environ['KERNEL']}.json"
          d=json.load(open(p))
          assert d["protocol"] == "N1-normalized-nested-comparator"
          assert d["profile"]["sobol_candidates"] == 512
          assert d["profile"]["polish_starts"] == 16
          assert d["profile"]["maxiter"] == 300
          assert d["kernel_pass"] is True
          assert d["transfer_identity_max_abs_error"] <= 1e-12
          for x in d["directions"]:
              assert x["embedding_score_error"] <= 1e-8
              assert x["nested_training_gap_M2_minus_M3"] >= -1e-8
              assert x["models"]["M2"]["historical_recovered"] is True
              assert x["models"]["M3"]["historical_recovered"] is True
          print("N1_KERNEL_PASS",os.environ["KERNEL"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SMM_STEP5B_OPT_N1_SUB001_${{ matrix.kernel }}
          path: n1_out/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate N1 cross-kernel decision
    needs: probe
    if: ${{ always() && needs.probe.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download all N1 kernel outputs
        uses: actions/download-artifact@v4
        with:
          pattern: SMM_STEP5B_OPT_N1_SUB001_*
          path: n1_outputs
          merge-multiple: true

      - name: Apply frozen N1 cross-kernel criteria
        run: |
          python confirmatory/step5b/aggregate_nested_optimizer_probe.py n1_outputs --out n1_optimizer_robustness.json
          cat n1_optimizer_robustness.md
          python - <<'PY'
          import json
          d=json.load(open("n1_optimizer_robustness.json"))
          assert d["selection_uses_delta_sign"] is False
          assert d["probe_pass"] is True
          print("N1_CROSS_KERNEL_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SMM_STEP5B_OPT_N1_AGGREGATE
          path: |
            n1_optimizer_robustness.json
            n1_optimizer_robustness.md
          if-no-files-found: error
          retention-days: 90
