name: Step 5B optimizer reproducibility sub-001

on:
  push:
    branches:
      - step5b-confirmatory-gate-2026-10-05
    paths:
      - '.github/workflows/step5b-development-smoke.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: step5b-development-opt-stability
  cancel-in-progress: true

jobs:
  replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        replicate: [1, 2, 3]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install frozen fit environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r confirmatory/step5b/requirements-gate.txt
          python - <<'PY'
          import mne,numpy,scipy,pandas,os
          assert mne.__version__ == "1.13.2"
          assert numpy.__version__ == "2.3.5"
          assert scipy.__version__ == "1.17.0"
          assert pandas.__version__ == "2.2.3"
          print("versions",mne.__version__,numpy.__version__,scipy.__version__,pandas.__version__)
          print("threads",{k:os.environ.get(k) for k in ["OMP_NUM_THREADS","OPENBLAS_NUM_THREADS","MKL_NUM_THREADS","NUMEXPR_NUM_THREADS","PYTHONHASHSEED"]})
          PY

      - name: Reconstruct and verify frozen DK68 network
        run: python confirmatory/step5b/reconstruct_network_frozen.py

      - name: Download validated forward gate
        uses: actions/download-artifact@v4
        with:
          name: SMM_STEP5B_FORWARD_GATE
          path: forward_gate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37376954431

      - name: Verify forward gate material hashes
        run: |
          echo "86afbddbd637ef4239b5755ef3853aafb62890ac989340fd093482ad7c9853b2  forward_gate/leadfield_DK68_64x68.csv" | sha256sum -c -
          echo "17eb1218c6cfb8b3e27ed51283e91d3e7068261a9c7595b6da2b2e358e3b8891  forward_gate/leadfield_U20.npy" | sha256sum -c -

      - name: Download QC-passed sub-001 epochs
        uses: actions/download-artifact@v4
        with:
          name: SMM_STEP5B_DEV_sub-001
          path: dev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37438628533

      - name: Run frozen M2-M3 CV
        env:
          REP: ${{ matrix.replicate }}
        run: |
          mkdir -p fit_out
          PYTHONPATH=confirmatory/step5b python confirmatory/step5b/fit_cv_subject.py \
            dev/clean-epo.fif \
            --forward-dir forward_gate \
            --network-dir confirmatory/step5b/network_frozen \
            --models M2 M3 \
            --out "fit_out/sub-001-rep${REP}.json"

      - name: Print numerical fingerprint
        env:
          REP: ${{ matrix.replicate }}
        run: |
          python - <<'PY'
          import os,json
          rep=os.environ["REP"]
          d=json.load(open(f"fit_out/sub-001-rep{rep}.json"))
          print("REPRO_FINGERPRINT",rep,d["models"]["M2"]["cv_elpd"],d["models"]["M3"]["cv_elpd"],d["delta_elpd_M3_minus_M2"])
          for m in ("M2","M3"):
              for x in d["models"][m]["directions"]:
                  print("OPT",rep,m,x["train"],x["optimizer"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SMM_STEP5B_OPT_REPRO_SUB001_REP${{ matrix.replicate }}
          path: fit_out/
          if-no-files-found: error
          retention-days: 90
