name: Step 5B EDF calibration diagnostic

on:
  push:
    branches:
      - step5b-confirmatory-gate-2026-10-05
    paths:
      - '.github/workflows/step5b-development-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step5b-edf-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        subject: [sub-001, sub-003, sub-010, sub-014, sub-043]
    env:
      OPENNEURO_COMMIT: 6a558cd5852503e66df9ac7fdac2f3a7f4ed5f12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install MNE
        run: |
          python -m pip install -r confirmatory/step5b/requirements-gate.txt
      - name: Download frozen EDF
        env:
          SUBJECT: ${{ matrix.subject }}
        run: |
          set -euo pipefail
          EDF="${SUBJECT}_ses-1_task-EyesClosed_acq-pre_eeg.edf"
          REL="${SUBJECT}/ses-1/eeg/${EDF}"
          mkdir -p diag
          POINTER_URL="https://raw.githubusercontent.com/OpenNeuroDatasets/ds005385/${OPENNEURO_COMMIT}/${REL}"
          curl --fail --location "${POINTER_URL}" -o diag/pointer.txt
          SHA="$(sed -n 's/.*SHA256E-s[0-9][0-9]*--\([0-9a-f]\{64\}\)\.edf.*/\1/p' diag/pointer.txt)"
          URL="https://s3.amazonaws.com/openneuro.org/ds005385/${REL}"
          curl --fail --location "${URL}" -o "diag/${EDF}"
          echo "${SHA}  diag/${EDF}" | sha256sum -c -
      - name: Inspect EDF calibration and offsets
        env:
          SUBJECT: ${{ matrix.subject }}
        run: |
          python - <<'PY'
          import os, json, numpy as np, mne
          from pathlib import Path
          s=os.environ["SUBJECT"]
          edf=Path("diag")/f"{s}_ses-1_task-EyesClosed_acq-pre_eeg.edf"
          raw=mne.io.read_raw_edf(edf,preload=True,verbose="error")
          if raw.ch_names[-1]=="Status":
              raw.drop_channels(["Status"])
          x=raw.get_data(picks="eeg")*1e6
          means=np.mean(x,axis=1)
          medians=np.median(x,axis=1)
          rms=np.sqrt(np.mean(x*x,axis=1))
          centered=x-np.mean(x,axis=1,keepdims=True)
          crms=np.sqrt(np.mean(centered*centered,axis=1))
          filt=raw.copy().filter(1.0,45.0,fir_design="firwin",phase="zero",verbose="error")
          xf=filt.get_data(picks="eeg")*1e6
          frms=np.sqrt(np.mean(xf*xf,axis=1))
          extra=raw._raw_extras[0]
          def arr(name):
              v=extra.get(name)
              if v is None: return None
              a=np.asarray(v)
              return {"min":float(np.nanmin(a)),"max":float(np.nanmax(a)),"unique_head":np.unique(a)[:12].tolist()}
          out={
            "subject":s,
            "n_channels":len(raw.ch_names),
            "raw_median_rms_uV":float(np.median(rms)),
            "centered_median_rms_uV":float(np.median(crms)),
            "filtered_1_45_median_rms_uV":float(np.median(frms)),
            "raw_abs_p999_uV":float(np.percentile(np.abs(x),99.9)),
            "centered_abs_p999_uV":float(np.percentile(np.abs(centered),99.9)),
            "filtered_abs_p999_uV":float(np.percentile(np.abs(xf),99.9)),
            "channel_mean_uV_range":[float(means.min()),float(means.max())],
            "channel_median_uV_range":[float(medians.min()),float(medians.max())],
            "physical_min":arr("physical_min"),
            "physical_max":arr("physical_max"),
            "digital_min":arr("digital_min"),
            "digital_max":arr("digital_max"),
            "units":arr("units"),
            "cal_first10":np.asarray(raw._cals)[:10].tolist()
          }
          print("EDF_DIAGNOSTIC_JSON="+json.dumps(out,sort_keys=True))
          PY
