name: Step 5B development fit smoke sub-001
# retrigger after interpolated-channel fit fix

on:
  push:
    branches:
      - step5b-confirmatory-gate-2026-10-05
    paths:
      - '.github/workflows/step5b-development-smoke.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: step5b-development-fit-smoke
  cancel-in-progress: true

jobs:
  fit-sub001:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install frozen fit environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r confirmatory/step5b/requirements-gate.txt
          python - <<'PY'
          import mne, numpy, scipy, pandas
          assert mne.__version__ == "1.13.2"
          print("fit environment", mne.__version__, numpy.__version__, scipy.__version__, pandas.__version__)
          PY

      - name: Reconstruct and verify frozen DK68 network
        run: |
          python confirmatory/step5b/reconstruct_network_frozen.py

      - name: Download validated forward gate
        uses: actions/download-artifact@v4
        with:
          name: SMM_STEP5B_FORWARD_GATE
          path: forward_gate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37376954431

      - name: Verify forward gate material hashes
        run: |
          echo "86afbddbd637ef4239b5755ef3853aafb62890ac989340fd093482ad7c9853b2  forward_gate/leadfield_DK68_64x68.csv" | sha256sum -c -
          echo "17eb1218c6cfb8b3e27ed51283e91d3e7068261a9c7595b6da2b2e358e3b8891  forward_gate/leadfield_U20.npy" | sha256sum -c -

      - name: Download QC-passed sub-001 development epochs
        uses: actions/download-artifact@v4
        with:
          name: SMM_STEP5B_DEV_sub-001
          path: dev_sub001
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37438628533

      - name: Run frozen M2/M3 two-block CV fit
        run: |
          mkdir -p fit_out
          PYTHONPATH=confirmatory/step5b python confirmatory/step5b/fit_cv_subject.py \
            dev_sub001/clean-epo.fif \
            --forward-dir forward_gate \
            --network-dir confirmatory/step5b/network_frozen \
            --models M2 M3 \
            --out fit_out/sub-001.json

      - name: Validate fit output
        run: |
          python - <<'PY'
          import json, math
          d=json.load(open("fit_out/sub-001.json"))
          assert d["n_epochs"] >= 30
          assert set(d["models"]) == {"M2","M3"}
          assert math.isfinite(d["delta_elpd_M3_minus_M2"])
          for m in ("M2","M3"):
              assert len(d["models"][m]["directions"]) == 2
          print("FIT_SMOKE_PASS")
          print("delta_elpd_M3_minus_M2", d["delta_elpd_M3_minus_M2"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SMM_STEP5B_DEV_FIT_SMOKE_SUB001
          path: fit_out/
          if-no-files-found: error
          retention-days: 90
