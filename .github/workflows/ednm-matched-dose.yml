name: EDNM matched KCl dose and uncoupling challenge
on:
  push:
    branches: [research/ednm-high-load-topology-20261126]
    paths: [.github/workflows/ednm-matched-dose.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  challenge:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        graph: [path, shortcut, weight_matched_path, glial_off]
        load: [low, high]
        exclude:
          - {graph: path, load: high}
          - {graph: shortcut, load: high}
          - {graph: weight_matched_path, load: high}
        source: [0, 2]
        dt: ['0.0005', '0.00025']
    env:
      GRAPH: ${{ matrix.graph }}
      LOAD: ${{ matrix.load }}
      SOURCE: ${{ matrix.source }}
      DT: ${{ matrix.dt }}
      PYTHONPATH: ${{ github.workspace }}/validation/graph_extensions
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned original full-physics solver
        run: |
          git clone -q https://github.com/martejulie/electrodiffusive-network-model.git external-ednm
          git -C external-ednm checkout -q 826c211c70d9027a4acb02202ca91a60de79a15d
          test "$(git -C external-ednm rev-parse HEAD)" = 826c211c70d9027a4acb02202ca91a60de79a15d
          python -m pip install 'numpy==1.26.4' 'scipy==1.12.0' 'numba==0.59.1'
          python -m pip install -e external-ednm
          python -c 'from ednm.aot_residual import residual; from ednm.aot_jacobian import jacobian'
      - name: Add graph adapter and prescribed neutral KCl mass source
        run: |
          python validation/graph_extensions/patch_source_solver.py external-ednm
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('external-ednm/src/ednm/solver.py')
          s=p.read_text()
          old='dt = 5e-5                # time step'
          assert s.count(old)==1
          s=s.replace(old,'dt = '+os.environ['DT']+'                # high-load topology challenge')
          old='        rsd = norm(Res, np.inf)'
          assert s.count(old)==1
          # Original residual convention is -new inventory + previous inventory + influx.
          # Add identical prescribed K and Cl amounts to the same somatic ECS control
          # volume: zero net external charge, positive KCl and osmotic load.
          # The source is state independent, so its state Jacobian is identically zero.
          add="""        source_rate = stimulus_protocol.get('kcl_rate_tissue', 0.0)
          if round(0.08/dt) <= round(t/dt) < round(0.28/dt):
              i = stimulus_protocol.get('kcl_site', 0)
              for ion in (1, 2):
                  Res[int(jc_s[ion][2] + N_unknowns_unit*i)] += dt*source_rate/model.gamma_m
          """
          # The YAML indentation above is removed by the YAML block scalar.
          # Construct the exact Python indentation independently.
          add = ('        source_rate = stimulus_protocol.get("kcl_rate_tissue", 0.0)\n'
                 '        if round(0.08/dt) <= round(t/dt) < round(0.28/dt):\n'
                 '            i = stimulus_protocol.get("kcl_site", 0)\n'
                 '            for ion in (1, 2):\n'
                 '                Res[int(jc_s[ion][2] + N_unknowns_unit*i)] += dt*source_rate/model.gamma_m\n')
          s=s.replace(old,add+old)
          p.write_text(s)
          PY
      - name: Run paired baseline and high-load challenge
        run: |
          cat > /tmp/challenge.py <<'PY'
          import contextlib, json, os, re
          from pathlib import Path
          import numpy as np
          from ednm import model, solver
          from ednm_graph_adapter import closed_path
          N=7; d_um=37.; dt=float(os.environ['DT'])
          source=int(os.environ['SOURCE']); variant=os.environ['GRAPH']
          # Same physical graph and source volume for every competing model.
          E=closed_path(N); G=E.copy()
          chords=[(0,4,.8),(1,5,.5),(2,6,.6)]
          if variant=='shortcut':
              for i,j,w in chords: G[i,j]=G[j,i]=w
          elif variant=='weight_matched_path':
              G *= (6+sum(w for _,_,w in chords))/6
          elif variant=='glial_off': G[:]=0.
          elif variant!='path': raise ValueError(variant)
          solver.graph_glial=G; solver.graph_ecs=E
          rate=3.0 if os.environ['LOAD']=='low' else 30.0 # identical 0.2 s KCl pulse, tenfold dose
          root=Path('output'); root.mkdir(exist_ok=True)
          def run(label,q):
              out=root/label; out.mkdir(exist_ok=True)
              m=model.Model(N,d_um*1e-4,0,0)
              protocol=dict(j_stim=0.,stim_start=.08,stim_end=.28,N_stim=1,
                            spike_train=np.zeros((2,N)),kcl_rate_tissue=q,kcl_site=source)
              with (out/'solver.log').open('w') as f,contextlib.redirect_stdout(f):
                  solver.solve_system(m,str(out)+'/',.8,protocol)
              d=np.load(out/'data.npz')
              t,alpha,c,phi,ss=[d[k] for k in ('t','alpha','c','phi','ss')]
              assert all(np.isfinite(a).all() for a in (t,alpha,c,phi,ss))
              fr=np.concatenate([alpha,1-alpha.sum(axis=2,keepdims=True)],axis=2)
              assert np.min(fr)>0 and np.min(c[:,:,:3,:,:])>0
              assert np.min(c)>=-1e-8
              inv=np.einsum('tldu,tlidu->ti',fr,c)
              nsteps=np.clip(np.rint(t/dt).astype(int)-round(.08/dt)+1,0,round(.28/dt)-round(.08/dt))
              expected=inv[0]+(nsteps*dt*q)[:,None]*np.array([0.,1.,1.,0.])[None,:]
              err=np.max(abs(inv-expected)/np.maximum(abs(expected),1e-12),axis=0)
              rows=[(int(i),float(e)) for i,e in re.findall(r'N_iter:\s*(\d+),\s*rsd:\s*([0-9.eE+-]+)',(out/'solver.log').read_text())]
              assert rows
              bad=sum(i>=10 and e>1e-12 for i,e in rows)
              assert bad==0 and max(err)<1e-7,(bad,err)
              ke=c[:,0,1,2,:]
              vm=phi[:,0,0,:]-phi[:,0,2,:]
              # Save exact full state, observable arrays, and numerical diagnostics.
              np.savez_compressed(out/'full_state.npz',t=t,alpha=alpha,c=c,phi=phi,ss=ss,dt=dt)
              d.close()
              (out/'data.npz').unlink()
              return t,ke,vm,dict(max_relative_mass_balance_error=err.tolist(),
                      max_newton_iterations=max(i for i,_ in rows),unconverged_timesteps=int(bad),
                      minimum_volume_fraction=float(np.min(fr)),minimum_noncalcium_concentration=float(np.min(c[:,:,:3,:,:])))
          t,k0,v0,a=run('baseline',0.)
          t1,k1,v1,b=run('high_load',rate)
          assert np.allclose(t,t1,rtol=0,atol=1e-12)
          k=k1-k0; v=v1-v0
          np.savez_compressed(root/'response.npz',t=t,dKe=k,dVm=v,Ke=k1,Vm=v1)
          ap=[]
          for j in range(N):
              armed=True; spikes=[]
              for ti,vi in zip(t,v1[:,j]):
                  if armed and vi>=-20: spikes.append(float(ti));armed=False
                  if vi < -40: armed=True
              ap.append(spikes)
          r=dict(graph=variant,load=os.environ['LOAD'],source=source,spacing_um=d_um,dt_s=dt,T_s=.8,
                 pulse_s=[.08,.28],source_rate_mM_tissue_s=rate,
                 total_delivered_K_and_Cl_each_mM_source_tissue=rate*.2,
                 G=G.tolist(),E=E.tolist(),
                 peak_delta_Ke_mM=np.max(k,axis=0).tolist(),
                 peak_absolute_Ke_mM=np.max(k1,axis=0).tolist(),
                 peak_abs_delta_Vm_mV=np.max(abs(v),axis=0).tolist(),
                 source_peak_delta_K_above_10mM=bool(np.max(k[:,source])>10),
                 spike_times_s=ap,baseline=a,high_load=b)
          (root/'summary.json').write_text(json.dumps(r,indent=2)+'\n')
          print('HIGH_LOAD_RESULT',json.dumps(r),flush=True)
          PY
          python /tmp/challenge.py
      - name: Archive exact source and environment
        if: always()
        run: |
          mkdir -p output
          git -C external-ednm diff -- src/ednm/solver.py > output/source_changes.diff
          git -C external-ednm rev-parse HEAD > output/pinned_source_commit.txt
          python -m pip freeze > output/versions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EDNM_DOSE_${{ matrix.load }}_${{ matrix.graph }}_src${{ matrix.source }}_dt${{ matrix.dt }}
          path: output/
          retention-days: 90
  contrast:
    needs: challenge
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          pattern: EDNM_DOSE_*
          path: data/new
      - uses: actions/download-artifact@v4
        with:
          pattern: EDNM_HIGH_LOAD_*_src*_dt*
          path: data/previous
          run-id: 45867493269
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Matched dose, uncoupling, event and topology comparisons
        run: |
          python - <<'PY'
          import json, numpy as np
          from pathlib import Path
          graphs=['path','shortcut','weight_matched_path','glial_off']
          rows=[]; events=[]; contrasts=[]
          def path_for(load,g,src,dt):
              if load=='high' and g!='glial_off':
                  return Path(f'data/previous/EDNM_HIGH_LOAD_{g}_src{src}_dt{dt}')
              return Path(f'data/new/EDNM_DOSE_{load}_{g}_src{src}_dt{dt}')
          def first(t,mask):
              ii=np.flatnonzero(mask)
              return float(t[ii[0]]) if len(ii) else None
          for src in [0,2]:
              for dt in ['0.0005','0.00025']:
                  all_loads={}
                  for load in ['low','high']:
                      paths={g:path_for(load,g,src,dt) for g in graphs}
                      if not all((p/'response.npz').exists() and (p/'summary.json').exists() for p in paths.values()):
                          print('INCOMPLETE',load,src,dt);continue
                      arr={g:np.load(p/'response.npz') for g,p in paths.items()}
                      sums={g:json.loads((p/'summary.json').read_text()) for g,p in paths.items()}
                      assert all(np.allclose(a['t'],arr['shortcut']['t'],rtol=0,atol=1e-12) for a in arr.values())
                      all_loads[load]={}
                      for g,a in arr.items():
                          t=a['t']; k=a['dKe']; vm=a['Vm']; last=t>=t[-1]-.1
                          peak=np.max(k,axis=0)
                          row=dict(load=load,source=src,dt=float(dt),graph=g,peak_K_mM_by_node=peak.tolist(),
                                   source_peak_K_mM=float(peak[src]),source_peak_above_10mM=bool(peak[src]>10),
                                   spike_times_s=sums[g]['spike_times_s'],
                                   first_delta_K_above_10mM_s=[first(t,k[:,j]>=10) for j in range(7)],
                                   first_Vm_above_minus40_s=[first(t,vm[:,j]>=-40) for j in range(7)],
                                   last_100ms_min_Vm_mV=np.min(vm[last],axis=0).tolist(),
                                   last_100ms_max_Vm_mV=np.max(vm[last],axis=0).tolist(),
                                   last_100ms_sustained_above_minus40=[bool(np.all(vm[last,j]>=-40)) for j in range(7)])
                          events.append(row)
                          print('DOSE_EVENTS',json.dumps(row),flush=True)
                      for rival in ['path','weight_matched_path','glial_off']:
                          a,b=arr[rival],arr['shortcut']
                          dk=b['dKe']-a['dKe']; dv=b['dVm']-a['dVm']
                          row=dict(load=load,source=src,dt=float(dt),rival=rival,
                              relative_K_contrast=float(np.linalg.norm(dk)/np.linalg.norm(a['dKe'])),
                              relative_Vm_contrast=float(np.linalg.norm(dv)/np.linalg.norm(a['dVm'])),
                              max_abs_K_difference_mM_by_node=np.max(abs(dk),axis=0).tolist(),
                              max_abs_Vm_difference_mV_by_node=np.max(abs(dv),axis=0).tolist(),
                              source_peak_K_mM={g:float(np.max(x['dKe'][:,src])) for g,x in arr.items()})
                          rows.append(row);all_loads[load][rival]=row
                          print('DOSE_CONTRAST',json.dumps(row),flush=True)
                      # The usual coupled-versus-uncoupled comparison holds topology path fixed.
                      a,b=arr['path'],arr['glial_off']
                      peaks={g:float(np.max(x['dKe'][:,src])) for g,x in arr.items()}
                      row=dict(load=load,source=src,dt=float(dt),rival='glial_off_vs_path',
                               relative_K_contrast=float(np.linalg.norm(b['dKe']-a['dKe'])/np.linalg.norm(a['dKe'])),
                               relative_Vm_contrast=float(np.linalg.norm(b['dVm']-a['dVm'])/np.linalg.norm(a['dVm'])),
                               source_peak_K_mM=peaks,
                               fractional_peak_increase_uncoupled=(peaks['glial_off']-peaks['path'])/peaks['path'])
                      rows.append(row);all_loads[load]['glial_off_vs_path']=row
                      print('UNCOUPLING_CONTRAST',json.dumps(row),flush=True)
                  if set(all_loads)=={'low','high'}:
                      for rival in all_loads['low']:
                          a=all_loads['low'][rival];b=all_loads['high'][rival]
                          row=dict(source=src,dt=float(dt),rival=rival,
                              high_over_low_relative_K=b['relative_K_contrast']/a['relative_K_contrast'],
                              high_over_low_relative_Vm=b['relative_Vm_contrast']/a['relative_Vm_contrast'])
                          contrasts.append(row);print('DOSE_GAIN',json.dumps(row),flush=True)
          Path('matched_dose.json').write_text(json.dumps(dict(rows=rows,events=events,high_over_low=contrasts),indent=2)+'\n')
          assert len(rows)==32 and len(events)==32 and len(contrasts)==16,'Incomplete dose comparison'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EDNM_MATCHED_DOSE_RESULTS
          path: matched_dose.json
          retention-days: 90
