name: Step 5B amended accounting synthetic gate (model-blind)

on:
  push:
    branches:
      - step5b-amended-analysis-2026-10-08
    paths:
      - .github/workflows/step5b-amended-synthetic-gate.yml

permissions:
  contents: read

jobs:
  synthetic_inference_and_accounting:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check frozen scientific files identical to original
        run: |
          test "$(git hash-object confirmatory/step5b/preprocess_ds005385.py)" = 797c7334c4431addf87c15bc6009b98ae24fd6cd
          test "$(git hash-object confirmatory/step5b/fit_cv_subject_n1.py)" = f2276f20ff6eb20666634b2b20fa21b66288780d
          test "$(git hash-object confirmatory/step5b/aggregate_confirmatory.py)" = 164ecf6f5ce55d7a71a4b78efe12305543755eed
          test "$(git hash-object confirmatory/step5b/NUMERICAL_PROFILE.json)" = fa13dd5f898f7ef6fc5c289fc7a0c851e2cd59a1
          echo "AMENDED_SCIENCE_BLOBS_UNMODIFIED=PASS"
      - name: Install unchanged pinned inference dependency
        run: python -m pip install numpy==2.3.5
      - name: Compile isolated amended code
        run: |
          python -m py_compile amended/step5b/preprocess_sub075.py
          python -m py_compile amended/step5b/aggregate_amended.py
          python -m py_compile amended/step5b/test_aggregate_amended.py
      - name: Test complete synthetic accounting and frozen numerical inference
        run: python amended/step5b/test_aggregate_amended.py
