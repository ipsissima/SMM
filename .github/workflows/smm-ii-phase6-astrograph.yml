name: SMM-II Phase VI AstroNet graph audit
on:
  push:
    branches: [research/smm-ii-public-data]
    paths: ['.github/workflows/smm-ii-phase6-astrograph.yml']
permissions:
  contents: read
jobs:
  graphs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy
      - run: python -u research/smm-ii/phase6/astro_graph_audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-astronet-graphs
          path: output/
          retention-days: 90
