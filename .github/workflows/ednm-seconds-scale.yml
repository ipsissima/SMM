name: EDNM seconds-scale charge-conserving glial transport test
on:
  push:
    branches: [research/ednm-full-solver-validation-20261126]
    paths: [.github/workflows/ednm-seconds-scale.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extended-ednm:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: native
            dt: '0.002'
          - variant: native_convergence
            dt: '0.001'
          - variant: glial_off
            dt: '0.002'
          - variant: glial_x2000
            dt: '0.002'
    env:
      EDNM_LONG_DT: ${{ matrix.dt }}
      EDNM_LONG_VARIANT: ${{ matrix.variant }}
      EDNM_LONG_DURATION: '2.0'
      EDNM_LONG_OUT: output/long_${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fetch exact published solver
        run: |
          git clone -q https://github.com/martejulie/electrodiffusive-network-model.git external-ednm
          git -C external-ednm checkout -q 826c211c70d9027a4acb02202ca91a60de79a15d
          test "$(git -C external-ednm rev-parse HEAD)" = "826c211c70d9027a4acb02202ca91a60de79a15d"
      - name: Install frozen compatible Python dependencies
        run: |
          python -m pip install 'numpy==1.26.4' 'scipy==1.12.0' 'numba==0.59.1'
          python -m pip install -e external-ednm
      - name: Apply explicitly audited numerical timestep and glial-only coefficient
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          solver=Path('external-ednm/src/ednm/solver.py')
          s=solver.read_text()
          old='dt = 5e-5                # time step'
          assert s.count(old)==1
          s=s.replace(old,'dt = '+os.environ['EDNM_LONG_DT']+'                # time step, seconds-scale numerical audit')
          solver.write_text(s)
          variant=os.environ['EDNM_LONG_VARIANT']
          if variant in ('glial_off','glial_x2000'):
              path=Path('external-ednm/src/ednm/model.py')
              m=path.read_text()
              anchor='f_1 = D[k] * upsilon[k][r] / (lambdas[r]**2 * dxu)'
              assert m.count(anchor)==1
              factor='0.0' if variant=='glial_off' else '2000.0'
              m=m.replace(anchor,'f_1 = ('+factor+' if r == 1 else 1.0) * D[k] * upsilon[k][r] / (lambdas[r]**2 * dxu)')
              path.write_text(m)
          print('NUMERICAL_DT',os.environ['EDNM_LONG_DT'],'PHYSICS_VARIANT',variant)
          PY
      - name: Recompile exact original AOT functions for glial interventions
        if: ${{ matrix.variant == 'glial_off' || matrix.variant == 'glial_x2000' }}
        run: |
          cd external-ednm
          python src/ednm/compile_residual_function.py
          python src/ednm/compile_jacobian_function.py
          python ../validation/fix_aot.py .
          cd ..
          python -c 'from ednm.aot_residual import residual;from ednm.aot_jacobian import jacobian;print("AOT OK")'
      - name: Test original solver and archive raw samples
        run: python validation/ednm_seconds_benchmark.py
      - name: Archive exact changes and environment
        if: always()
        run: |
          mkdir -p "$EDNM_LONG_OUT"
          git -C external-ednm diff -- src/ednm/model.py src/ednm/solver.py > "$EDNM_LONG_OUT/changes_to_original.diff"
          git -C external-ednm rev-parse HEAD > "$EDNM_LONG_OUT/pinned_original_sha.txt"
          python -m pip freeze > "$EDNM_LONG_OUT/python_packages.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EDNM_SECONDS_${{ matrix.variant }}
          path: output/long_${{ matrix.variant }}/
          retention-days: 30
